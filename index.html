<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mehrab Hasan — Researcher &amp; Engineer</title>
  <meta name="description"
    content="PhD researcher in Aerospace & Mechanical Engineering — smart materials, lithium battery modeling, and physics-informed machine learning." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

  <!-- Favicon -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg-dark: #07080d;
      --bg-section: #0c0e18;
      --bg-card: rgba(17, 22, 40, 0.65);
      --bg-card-hover: rgba(25, 32, 58, 0.8);
      --accent: #00c6ff;
      --accent2: #7f5af0;
      --accent3: #2ee89e;
      --gradient: linear-gradient(135deg, #00c6ff, #7f5af0);
      --gradient2: linear-gradient(135deg, #7f5af0, #2ee89e);
      --text: #e2e8f0;
      --text-dim: #8892b0;
      --text-dimmer: #5a6380;
      --border: rgba(100, 130, 200, 0.1);
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      --max-width: 1100px;
    }

    /* ===== RESET ===== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 80px;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.7;
      font-weight: 400;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: var(--transition);
    }

    a:hover {
      color: #fff;
    }

    img {
      max-width: 100%;
      display: block;
    }

    ul {
      list-style: none;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent2);
      border-radius: 10px;
    }

    /* ===== LOADER ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s, visibility 0.6s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 56px;
      height: 56px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ===== NAVIGATION ===== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 24px;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7, 8, 13, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid transparent;
      transition: var(--transition);
    }

    nav.scrolled {
      border-bottom-color: var(--border);
      background: rgba(7, 8, 13, 0.92);
    }

    .nav-logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 500;
      padding: 8px 16px;
      color: var(--text-dim);
      border-radius: 8px;
      transition: var(--transition);
      position: relative;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--accent);
      background: rgba(0, 198, 255, 0.06);
    }

    .nav-links a.active::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      z-index: 1001;
    }

    .hamburger span {
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: var(--transition);
    }

    .hamburger.open span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .hamburger.open span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.open span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ===== SCROLL PROGRESS ===== */
    .scroll-progress {
      position: fixed;
      top: 70px;
      left: 0;
      height: 2px;
      z-index: 999;
      background: var(--gradient);
      width: 0%;
      transition: none;
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
      overflow: hidden;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(transparent, var(--bg-dark));
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 820px;
    }

    .hero-greeting {
      font-size: 1rem;
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s 0.3s forwards;
    }

    .hero-name {
      font-family: var(--font-heading);
      font-size: clamp(2.8rem, 7vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #00c6ff 50%, #7f5af0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .hero-title {
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      color: var(--text-dim);
      font-weight: 400;
      margin-bottom: 32px;
      max-width: 640px;
      margin-inline: auto;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp 0.8s 0.9s forwards;
    }

    .hero-tag {
      padding: 8px 20px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--text-dim);
      background: rgba(17, 22, 40, 0.5);
      backdrop-filter: blur(8px);
      transition: var(--transition);
    }

    .hero-tag:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .hero-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-primary {
      background: var(--gradient);
      color: #fff;
      box-shadow: 0 4px 24px rgba(0, 198, 255, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0, 198, 255, 0.35);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid rgba(0, 198, 255, 0.4);
    }

    .btn-outline:hover {
      background: rgba(0, 198, 255, 0.08);
      transform: translateY(-2px);
      color: var(--accent);
    }

    /* ===== SCROLL INDICATOR ===== */
    .scroll-indicator {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-dimmer);
